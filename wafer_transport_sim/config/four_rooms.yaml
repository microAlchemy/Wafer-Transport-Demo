/**:
  ros__parameters:
    use_sim_time: true
    sensor_timeout: 1.0
    state_timeout: 60.0
transport_controller:
  ros__parameters:
    route_speed: 0.20
    room_speed: 0.15
    turn_speed: 0.55
    door_speed: 0.18
    door_open_hold: 0.5
    mission_timeout: 600.0
    startup_timeout_wall: 90.0
    intermediate_transfers: true
    placement_hold: 1.0
    minimum_cruise_speed: 0.07
    curve_speed: 0.09
    braking_acceleration: 0.35
    allow_sensor_fallback: true
ir_line_follower:
  ros__parameters:
    linear_speed: 0.20
    kp: 25.0
    max_angular_speed: 1.4
    curve_speed: 0.09
    sensor_forward: 0.10684
    detection_radius: 0.025
line_follower:
  ros__parameters:
    linear_speed: 0.20
    kp: 0.007
    max_angular_speed: 1.4
    threshold: 55
    camera_crop_ratio: 0.35
qr_detector:
  ros__parameters:
    valid_codes: [ROOM_1, ROOM_2, ROOM_3, ROOM_4]
    confirmation_frames: 3
    minimum_qr_side_pixels: 55.0
