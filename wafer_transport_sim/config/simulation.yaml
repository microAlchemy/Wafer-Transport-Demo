/**:
  ros__parameters:
    use_sim_time: true
    sensor_timeout: 1.0
    state_timeout: 30.0

wafer_handler:
  ros__parameters:
    room_speed: 0.06
    turn_speed: 0.55
    door_speed: 0.10
line_follower:
  ros__parameters:
    linear_speed: 0.06
    kp: 0.004
    max_angular_speed: 0.6
    threshold: 55
    camera_crop_ratio: 0.35
qr_detector:
  ros__parameters:
    confirmation_frames: 3
    minimum_qr_side_pixels: 70.0
transport_controller:
  ros__parameters:
    destination_station: STATION_C
    station_distances: [0.28, 0.60, 0.92]
    slow_distance: 0.10
    position_tolerance: 0.01
    mission_timeout: 120.0
docking_controller:
  ros__parameters:
    station_distances: [0.28, 0.60, 0.92]
    position_tolerance: 0.01
    approach_speed: 0.018
    dock_gain: 0.8
    stop_velocity: 0.004
system_manager:
  ros__parameters:
    startup_timeout_wall: 90.0
